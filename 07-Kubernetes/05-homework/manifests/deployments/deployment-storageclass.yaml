apiVersion: apps/v1
kind: Deployment

metadata:
  name: sc-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sc-demo

  template:
    metadata:
      labels:
        app: sc-demo

    spec:
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: sc-pvc

      containers:

      - name: busybox
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          while true; do
            date >> /shared/data.txt
            sleep 5
          done

        volumeMounts:
        - name: storage
          mountPath: /shared

      - name: multitool
        image: wbitt/network-multitool

        volumeMounts:
        - name: storage
          mountPath: /shared
