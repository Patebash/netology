frontend:
  replicaCount: 2

  image:
    repository: nginx
    tag: "1.27"
    pullPolicy: IfNotPresent

  containerPort: 80

  service:
    type: ClusterIP
    port: 80


backend:
  replicaCount: 2

  image:
    repository: wbitt/network-multitool
    tag: "latest"
    pullPolicy: IfNotPresent

  containerPort: 80

  service:
    type: ClusterIP
    port: 8080
