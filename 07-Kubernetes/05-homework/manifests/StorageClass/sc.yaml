apiVersion: storage.k8s.io/v1
kind: StorageClass

metadata:
  name: local-storage

provisioner: microk8s.io/hostpath

reclaimPolicy: Delete

volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: sc-pvc

spec:
  storageClassName: local-storage

  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi
