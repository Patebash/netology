apiVersion: v1
kind: Service

metadata:
  name: {{ include "myapp.fullname" . }}-backend
  labels:
    app: backend

spec:
  type: {{ .Values.backend.service.type }}

  selector:
    app: backend

  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.containerPort }}
      protocol: TCP
      name: http
