apiVersion: v1
kind: Service

metadata:
  name: {{ include "myapp.fullname" . }}-frontend
  labels:
    app: frontend

spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    app: frontend

  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.containerPort }}
      protocol: TCP
      name: http
